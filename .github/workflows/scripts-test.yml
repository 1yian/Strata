name: Scripts test

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/intake.yml'
      - '.github/workflows/reopen.yml'

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/item-check.test.js
